<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIZ OKI 3.5 — Executive Briefing</title>
    <meta
      name="description"
      content="Domain-adaptive executive briefing for MIZ OKI 3.5. A clear process from exposure to decision across logistics, HR, finance, ops, CX, and supply chain."
    />
    <meta name="theme-color" content="#0A1418" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/briefing.css" />
  </head>
  <body>
    <!--
      MIZ OKI 3.5 Executive Briefing
      Standalone page or embed target for mizoki3.com

      Site integration options:
      1) Full page: host this folder at /executive-briefing/
      2) Modal/iframe: load index.html in iframe; listen for postMessage
      3) Inline: include #mizoki-briefing + scripts on any page

      Optional config before app.js:
      window.MIZOKI_CONFIG = {
        contactUrl: 'https://mizoki3.com/#contact',
        onDecisionConfirmed: function (payload) { ... }
      };
    -->
    <div id="mizoki-briefing" role="application" aria-label="MIZ OKI executive briefing"></div>

    <script>
      // Site integration: confirmed decisions route through the site's real
      // lead path (/contact, which already reads ?source=). Intent + domain
      // travel as query params; company/role stay out of the URL — the contact
      // page prefers them from sessionStorage. An embedding page can still
      // supply its own MIZOKI_CONFIG before this script to override.
      window.MIZOKI_CONFIG = window.MIZOKI_CONFIG || {
        contactUrl: "/contact",
        onDecisionConfirmed: function (payload) {
          var allowedIntents = { pilot: true, board: true, "deep-dive": true };
          if (!payload || allowedIntents[payload.intent] !== true) {
            console.error("Invalid Executive Briefing decision payload.");
            return;
          }
          var domains = (window.MIZOKI && window.MIZOKI.DOMAINS) || {};
          var decision = {
            intent: String(payload.intent),
            domain: Object.prototype.hasOwnProperty.call(domains, payload.domain)
              ? String(payload.domain)
              : "",
            role: String(payload.role || ""),
            companyName: String(payload.companyName || ""),
            companySize: String(payload.companySize || ""),
            source: "executive-briefing",
            confirmedAt: new Date().toISOString(),
          };
          try {
            sessionStorage.setItem(
              "mizoki.executiveBriefing.decision",
              JSON.stringify(decision)
            );
          } catch (error) {
            console.warn("Unable to persist briefing decision.", error);
          }
          var url = new URL(
            window.MIZOKI_CONFIG.contactUrl || "/contact",
            window.location.origin
          );
          url.searchParams.set("source", "executive-briefing");
          url.searchParams.set("intent", decision.intent);
          if (decision.domain) {
            url.searchParams.set("domain", decision.domain);
          }
          window.location.assign(url.toString());
        },
      };
    </script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/guide.js?v=20260802"></script>
  </body>
</html>
